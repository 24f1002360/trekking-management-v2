<!DOCTYPE html>
<html>
    <head>
        <title>Trek Reminder</title >
    </head>
    <body>
        <h2> Hello {{ name }},</h2>
        <p> This is a reminder that your trek <b> {{ trek }}</b> will start on <b> {{ start_date }}</b> </p>
        <p> Location: <b> {{ location }}</b> </p>
        <p> Please reach the reporting location on time .
            Carry your Id proof, water bottle and necessary trekking gear.
        </p>
        <p> Happy Journey </p>
    </body>
</html>
